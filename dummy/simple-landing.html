<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintra - Your helpers that never sleep</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            background-color: #ffffff;
            color: #000000;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .background-video {
            position: absolute;
            top: 100px;
            left: 950px;
            width: 600px;
            height: 600px;
            object-fit: cover;
            z-index: -1;
            transform: scaleX(-1);
            opacity: 0.3;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 90px;
            padding: 1.5rem 3rem;
            background-color: #000000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 600;
            width: 150px;
            color: #ffffff;
            width: 180px;
            text-decoration: none;
        }

        .logo img {
            width: 130px;
            height: auto;
            vertical-align: middle;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 3rem;
            align-items: center;
        }

        .nav-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
        }

        .nav-buttons {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .login-btn {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
        }

        .get-started-btn {
            background: #4A90E2;
            color: #ffffff;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            font-weight: 500;
        }

        /* Hero Content */
        .hero-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-text {
            flex: 1;
            max-width: 600px;
        }

        .hero-title {
            font-size: 4.5rem;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: #000000;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: #333333;
            margin-bottom: 2.5rem;
            line-height: 1.5;
            font-weight: 400;
        }

        .cta-button {
            background: #4A90E2;
            color: #ffffff;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-weight: 500;
            font-size: 1rem;
            display: inline-block;
        }

        /* Hero Image */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character-container {
            width: 350px;
            height: 350px;
            background: #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character {
            font-size: 180px;
        }

        /* Center Image */
        .center-image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-image {
            width: 40px;
            height: 40px;
            object-fit: contain;
            display: block;
            transform: translate(-110px, 90px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .nav-menu {
                display: none;
            }

            .hero-content {
                flex-direction: column;
                text-align: center;
                padding: 2rem 1rem;
                gap: 3rem;
            }

            .hero-title {
                font-size: 3rem;
            }

            .hero-subtitle {
                font-size: 1.1rem;
            }

            .character-container {
                width: 250px;
                height: 250px;
            }

            .character {
                font-size: 120px;
            }
        }
    </style>
</head>

<body>
    <section class="hero-section">
        <!-- Background Video -->
        <video class="background-video" autoplay muted loop playsinline>
            <source src="./Untitled design .mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Navigation -->
        <nav class="navbar">
            <a href="#" class="logo"><img src="./bxm logo.jpg" alt="BXM Logo" style="height: 90px; vertical-align: middle;"></a>
            <ul class="nav-menu">
                <li><a href="#">Products</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Resources</a></li>
                <li><a href="#">Careers</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="#" class="login-btn">Log in</a>
                <a href="#" class="get-started-btn">Get Started</a>
            </div>
        </nav>

        <!-- Hero Content -->
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">Your helpers that never sleep.</h1>
                <p class="hero-subtitle">Build, grow, and scale your business with a team of AI helpers.</p>
                <a href="#" class="cta-button">Get BXM</a>
            </div>

            <div class="center-image-container">
                <!-- <img src="./x logo.jpg" alt="Centered BXM Logo" class="center-image"> -->
            </div>
        </div>
    </section>
</body>

</html>
